{% extends 'layout.html' %}

{% block title %}
  [r.va.gg] {{ spec.title }}
{% endblock %}

{%- block meta %}
    <meta property="og:site_name" content="r.va.gg">
    <meta property="og:type" content="article">
    <meta property="og:title" content="{{ spec.title }}">
    <meta property="og:url" content="https://r.va.gg{{ spec.path }}">
    <meta property="article:published_time" content="{{ spec.date|date("Y-m-d") }}">
    {%- if spec.description %}
    <meta property="og:description" content="{{ spec.description }}">
    <meta name="twitter:description" content="{{ spec.description }}">
    {%- endif %}
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{ spec.title }}">
{%- endblock %}

{% block content %}

  <section class="post-content">

    <h2><a href="{{ spec.path }}">{{ spec.title }}</a></h2>

    <div class="post-meta">
      <p class="byline">by {{ spec.author }} on {{ spec.date|date("F j, Y") }}</p>
    </div>

    <section class="post-body">
      {{ page|raw }}
    </section>

    <section class="comments">
      <div id="disqus_thread"></div>
      <script type="text/javascript">
        var disqus_shortname  = 'rvagg'
          , disqus_identifier = '{{ spec.path }}'
          , disqus_title      = '{{ spec.title }}'
          , disqus_url        = 'https://r.va.gg{{ spec.path }}'

        !(function() {
          var dsq = document.createElement('script')
          dsq.type = 'text/javascript'
          dsq.async = true
          dsq.src = '//' + disqus_shortname + '.disqus.com/embed.js'
          !(document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq)
        })()
      </script>
      <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments.</a></noscript>
    </section>

  </section>

{% endblock %}
